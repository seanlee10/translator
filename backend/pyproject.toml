[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-caption-translator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "deepgram-sdk>=7.0",
    "anthropic>=0.40",
    "groq>=0.11",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Arize AX tracing. Required imports, optional behaviour: app/tracing.py
    # stays a no-op unless ARIZE_SPACE_ID and ARIZE_API_KEY are both set, so
    # the suite and a keyless server never touch an exporter.
    "arize-otel>=0.13",
    "openinference-instrumentation-anthropic>=1.1",
    "openinference-instrumentation-groq>=0.1.20",
    "openinference-instrumentation-openai>=0.1.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.setuptools.packages.find]
include = ["app*"]
